<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Alarmy - Báo Thức Thông Minh</title>
    <!-- Font Awesome 6 (free) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #e5e5e5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* 手机容器 */
        .phone {
            width: 375px;
            height: 700px;
            background-color: #ffffff;
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
            overflow-y: auto;
            overflow-x: hidden;
            position: relative;
            scroll-behavior: smooth;
        }

        .phone::-webkit-scrollbar {
            width: 4px;
        }

        /* 全局样式 */
        .container {
            padding: 20px 16px 80px 16px;
        }

        /* 顶部状态栏+天气+积分 */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font-size: 14px;
            font-weight: 500;
            color: #1c1c1e;
            margin-bottom: 12px;
        }
        .time-badge {
            background: #f2f2f6;
            padding: 6px 12px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 600;
        }
        .weather-points {
            display: flex;
            gap: 12px;
            background: #f2f2f6;
            padding: 6px 12px;
            border-radius: 30px;
            font-size: 13px;
        }
        .weather-points i, .weather-points span {
            margin-right: 4px;
        }

        /* 卡片通用 */
        .card {
            background: #fff;
            border-radius: 24px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.05), 0 1px 2px rgba(0,0,0,0.03);
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid #f0f0f0;
        }

        .section-title {
            font-weight: 700;
            font-size: 18px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 底部导航 */
        .bottom-nav {
            position: sticky;
            bottom: 0;
            background: rgba(255,255,255,0.96);
            backdrop-filter: blur(10px);
            border-top: 1px solid #e9e9ef;
            display: flex;
            justify-content: space-around;
            padding: 10px 16px 14px;
            border-radius: 28px 28px 0 0;
            margin-top: 8px;
            z-index: 10;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            color: #8e8e93;
            font-weight: 500;
            transition: 0.1s;
            cursor: pointer;
        }
        .nav-item i {
            font-size: 22px;
        }
        .nav-item.active {
            color: #007aff;
        }

        /* 闹钟列表 */
        .alarm-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .alarm-time {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .alarm-label {
            font-size: 13px;
            color: #6c6c70;
        }
        .toggle-switch {
            width: 48px;
            height: 28px;
            background: #e5e5ea;
            border-radius: 30px;
            position: relative;
        }
        .toggle-switch.active {
            background: #34c759;
        }

        /* 任务列表样式 */
        .task-group {
            margin-bottom: 24px;
        }
        .task-group-title {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 12px;
            padding-left: 4px;
            color: #1c1c1e;
        }
        .task-card {
            background: #f9f9fb;
            border-radius: 20px;
            padding: 14px 16px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #efeff4;
        }
        .task-name {
            font-weight: 600;
            font-size: 16px;
        }
        .task-badge {
            font-size: 12px;
            background: #e9e9ef;
            border-radius: 20px;
            padding: 2px 10px;
            margin-left: 8px;
        }
        .preview-btn {
            background: white;
            border: 1px solid #c6c6c8;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
        }

        /* 模态框背景 */
        .modal-mask {
            position: fixed;
            top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }
        .modal-content {
            width: 320px;
            background: white;
            border-radius: 32px;
            padding: 20px;
            max-height: 80%;
            overflow-y: auto;
            box-shadow: 0 25px 50px -12px black;
        }

        /* 睡眠图表模拟 */
        .sleep-chart {
            display: flex;
            gap: 8px;
            margin: 16px 0;
        }
        .chart-bar {
            flex:1;
            height: 80px;
            background: #e9e9ef;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
        }
        .bar-fill {
            position: absolute;
            bottom:0;
            width:100%;
            background: #007aff;
            border-radius: 20px;
        }

        button, .preview-btn, .nav-item, .toggle-switch {
            cursor: pointer;
        }
        .pro-badge {
            background: #ffd60a;
            color: #1c1c1e;
            border-radius: 20px;
            padding: 4px 10px;
            font-size: 12px;
            font-weight: 700;
        }
        .text-small { font-size: 12px; color: #6c6c70; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>
<div class="phone" id="app">
    <div class="container" id="main-content">
        <!-- 动态内容根据Tab渲染 -->
    </div>
    <div class="bottom-nav">
        <div class="nav-item" data-tab="alarm"><i class="fas fa-clock"></i><span>Báo thức</span></div>
        <div class="nav-item" data-tab="sleep"><i class="fas fa-bed"></i><span>Giấc ngủ</span></div>
        <div class="nav-item" data-tab="morning"><i class="fas fa-sun"></i><span>Sáng</span></div>
        <div class="nav-item" data-tab="report"><i class="fas fa-chart-line"></i><span>Báo cáo</span></div>
        <div class="nav-item" data-tab="settings"><i class="fas fa-cog"></i><span>Cài đặt</span></div>
    </div>
</div>

<script>
    // ----- Dữ liệu giả lập -----
    let currentTab = "alarm";
    let modalVisible = false;
    let currentPreviewTask = null;

    // Danh sách nhiệm vụ (Sáng tab)
    const tasks = {
        popular: [
            { name: "Tìm đồ gia dụng", badge: "[AI]", type: "find_object" },
            { name: "Vé May Mẫn Chắc Chắn", badge: "[POINT]", type: "scratch" }
        ],
        brain: [
            { name: "Tìm các ô màu", badge: "", type: "color_tile" },
            { name: "Gõ văn bản", badge: "", type: "typing" },
            { name: "Giải toán", badge: "[BEST]", type: "math" },
            { name: "Biểu tượng bị thiếu", badge: "", type: "missing_symbol" }
        ],
        body: [
            { name: "Bước", badge: "[HOT]", type: "steps" },
            { name: "Mã QR/Mã vạch", badge: "", type: "qr" },
            { name: "Lắc điện thoại", badge: "", type: "shake" },
            { name: "Ảnh chụp", badge: "", type: "photo" },
            { name: "Squat", badge: "", type: "squat" }
        ]
    };

    // Hàm hiển thị modal preview theo loại
    function showPreview(taskType) {
        let html = '';
        const closeModal = () => {
            if (document.querySelector('.modal-mask')) document.querySelector('.modal-mask').remove();
            modalVisible = false;
        };

        switch(taskType) {
            case "squat":
                html = `<div style="text-align:center"><h3>Squat</h3><p>Động tác squat buổi sáng cho ngày mỗi năng động</p><div class="flex-between" style="margin:20px 0"><span>15</span><strong>20 lần</strong><span>25</span></div><div class="flex-between"><button class="preview-btn">Xem trước</button><button class="preview-btn" style="background:#007aff;color:white" id="modalClose">Xong</button></div><div class="text-small" style="margin-top:12px">Nhận gói dùng thử Pro miễn phí</div></div>`;
                break;
            case "steps":
                html = `<div><h3>Bước</h3><p>Ra khỏi giường và đi bộ - thực sự hiệu quả!</p><div>Take steps softly 13</div><div class="flex-between" style="margin:16px 0"><span>15</span><span>20</span><span>25</span></div><div>Bước</div><div class="flex-between mt-2"><button class="preview-btn">Xem trước</button><button class="preview-btn" id="modalClose" style="background:#007aff;color:white">Xong</button></div><div class="text-small">Nhận gói dùng thử Pro miễn phí</div></div>`;
                break;
            case "qr":
                html = `<div><h3>Mã QR/Mã vạch</h3><p>Quét mã đối với một phần lịch trình buổi sáng của bạn</p><div>Body Lotion<br>Body Wash</div><div style="background:#f2f2f6; padding:20px; text-align:center;margin:16px 0">📷 Quét</div><button id="modalClose" class="preview-btn">Xong</button></div>`;
                break;
            case "shake":
                html = `<div><h3>Lắc điện thoại</h3><div class="flex-between"><span>Dễ</span><span>Rất dễ → Rất khó</span></div><div class="flex-between" style="margin:12px 0"><span>9</span><strong>10 lần</strong><span>11</span></div><div class="flex-between"><button class="preview-btn">Xem trước</button><button id="modalClose" class="preview-btn" style="background:#007aff;color:white">Xong</button></div></div>`;
                break;
            case "photo":
                html = `<div><h3>Ảnh chụp</h3><p>Chụp ảnh một phần lịch trình buổi sáng của bạn</p><div style="display:flex; gap:12px; margin:16px 0"><button class="preview-btn">Chụp ảnh mới</button><button class="preview-btn">Chọn từ album</button></div><button id="modalClose" class="preview-btn">Xong</button></div>`;
                break;
            case "color_tile":
                html = `<div><h3>Tìm các ô màu</h3><div>Ví dụ</div><div class="flex-between"><span>Rất dễ</span><span>Rất khó</span></div><div class="flex-between" style="margin:12px 0"><span>2</span><strong>3 vòng</strong><span>4</span></div><div class="flex-between"><button class="preview-btn">Xem trước</button><button id="modalClose" class="preview-btn">Xong</button></div></div>`;
                break;
            case "typing":
                html = `<div><h3>Gõ văn bản</h3><p>Ví dụ: Stay brave</p><div class="flex-between"><span>1 lần</span><span>2</span></div><div>Chọn cụm từ 40 cụm từ</div><div class="flex-between mt-2"><button class="preview-btn">Xem trước</button><button id="modalClose" class="preview-btn">Xong</button></div></div>`;
                break;
            case "math":
                html = `<div><h3>Giải toán</h3><p>Ví dụ: 8 + 9 = <strong>17</strong></p><div>Dễ</div><div class="flex-between"><span>Rất dễ</span><span>Chế độ cực khó</span></div><div class="flex-between"><span>2</span><span>3 lần</span><span>4</span></div><div class="flex-between"><button class="preview-btn">Xem trước</button><button id="modalClose" class="preview-btn">Xong</button></div></div>`;
                break;
            case "missing_symbol":
                html = `<div><h3>Biểu tượng bị thiếu</h3><p>Ví dụ: 3 ? 8 = 11</p><div class="flex-between"><span>Rất dễ</span><span>Rất khó</span></div><div class="flex-between"><span>2</span><span>3</span><span>4</span></div><div class="flex-between"><button class="preview-btn">Xem trước</button><button id="modalClose" class="preview-btn">Xong</button></div><div class="text-small">Nhận gói dùng thử Pro miễn phí</div></div>`;
                break;
            case "scratch":
                html = `<div><h3>Vé May Mẫn Chắc Chắn</h3><div style="background:#f9e4b7; padding:20px; text-align:center; margin:12px 0; border-radius:20px">Scratch the ticket!<br><strong>CLEAR!</strong><br>Tap!</div><div>POINT: Nhận điểm mỗi ngày</div><div class="flex-between"><span>Dễ 30 lần</span><span>50</span></div><div class="flex-between"><button class="preview-btn">Xem trước</button><button id="modalClose" class="preview-btn">Xong</button></div></div>`;
                break;
            case "find_object":
                html = `<div><h3>Tìm đồ gia dụng [AI]</h3><p>Tìm đồ vật trên màn hình để tắt báo thức</p><div style="background:#eef2ff; padding:16px; border-radius:24px; text-align:center; margin:12px 0">Cup <i class="fas fa-camera"></i></div><div>Cần có camera</div><div>Bạn không có đồ vật đó? Nhấn thử lại</div><div><strong>Chọn đồ vật</strong> 19 đồ vật ></div><div class="flex-between"><button class="preview-btn">Xem trước</button><button id="modalClose" class="preview-btn">Cho phép quyền</button></div></div>`;
                break;
            default: html = `<div>Chức năng đang phát triển</div><button id="modalClose">Đóng</button>`;
        }
        // tạo modal
        const modalDiv = document.createElement('div');
        modalDiv.className = 'modal-mask';
        modalDiv.innerHTML = `<div class="modal-content">${html}</div>`;
        document.body.appendChild(modalDiv);
        modalDiv.addEventListener('click', (e) => {
            if(e.target === modalDiv || e.target.id === 'modalClose') modalDiv.remove();
        });
    }

    // Render nội dung theo tab
    function renderTab(tab) {
        const container = document.getElementById('main-content');
        if(!container) return;
        let html = '';
        // Top bar chung (thời gian + thời tiết điểm)
        const now = new Date();
        const timeStr = now.toLocaleTimeString('vi-VN', {hour:'2-digit', minute:'2-digit'});
        html += `<div class="status-bar">
                    <div class="time-badge"><i class="far fa-clock"></i> ${timeStr}</div>
                    <div class="weather-points"><i class="fas fa-cloud-sun"></i> 26° <span><i class="fas fa-star"></i> 1,280</span></div>
                </div>`;

        if(tab === 'alarm') {
            html += `
                <div class="card" style="background:#f2f2f6;">
                    <div class="flex-between"><span><strong>Chuông báo thức đổ chuông sau 5giờ 36phút</strong></span><span class="pro-badge">PRO Free Trial</span></div>
                    <div style="margin:10px 0">Lại ngủ nữa à? Thử nhiệm vụ mới của chúng tôi</div>
                    <div class="flex-between"><span>Đồ chuông sau 5giờ 36phút</span><i class="fas fa-chevron-right"></i></div>
                </div>
                <div class="card">
                    <div class="section-title">Báo thức của tôi</div>
                    <div class="alarm-item"><div><div class="alarm-time">06:00</div><div class="alarm-label">CN T2 T3 T4 T5 T6 T7</div></div><div class="toggle-switch active"></div></div>
                    <div class="alarm-item"><div><div class="alarm-time">07:30</div><div class="alarm-label">CN T2 T3 T4 T5 T6 T7</div></div><div class="toggle-switch"></div></div>
                    <div class="alarm-item"><div><div class="alarm-time">14:00</div><div class="alarm-label">Báo thức ngày thường</div></div><div class="toggle-switch active"></div></div>
                </div>
                <div class="card">
                    <div class="flex-between"><span><strong>Với Alarmy Pro, một báo thức là đủ</strong></span><button class="preview-btn" style="background:#007aff;color:white">Dùng thử với $0</button></div>
                    <div class="text-small">Không tính phí cho đến khi hết thời gian dùng thử</div>
                </div>
                <div class="card">
                    <div class="section-title">Chuông báo thức</div>
                    <div>Âm thanh báo thức</div>
                    <div class="flex-between"><span>🔔 Chuông Báo Cháy</span><span>30 giây</span></div>
                    <div>Lời nhắc thời gian ▶ Ví dụ</div>
                    <div>Lời nhắc thời tiết ▶ Ví dụ</div>
                    <div class="flex-between"><span>Cài đặt tùy chỉnh</span><span>Báo lại 3 phút</span></div>
                </div>
            `;
        } 
        else if(tab === 'sleep') {
            html += `
                <div class="card">
                    <div class="section-title">Giấc ngủ <i class="fas fa-chart-simple"></i></div>
                    <div>Đang theo dõi giấc ngủ... <i class="fas fa-moon"></i></div>
                    <div class="sleep-chart">
                        <div class="chart-bar"><div class="bar-fill" style="height:70%"></div><div class="text-small">Ngủ sâu</div></div>
                        <div class="chart-bar"><div class="bar-fill" style="height:45%"></div><div>REM</div></div>
                        <div class="chart-bar"><div class="bar-fill" style="height:60%"></div><div>Ngủ nông</div></div>
                        <div class="chart-bar"><div class="bar-fill" style="height:25%"></div><div>Thức</div></div>
                    </div>
                    <button class="preview-btn" style="width:100%; margin-top:8px">Phân tích hồi thở của bạn</button>
                </div>
                <div class="card">
                    <div class="flex-between"><span>Phát hiện chuyển động</span><span>Kết thúc</span></div>
                    <div><i class="fas fa-head-side-vr"></i> In the forest 29:42</div>
                    <div>Theo dõi tiếng ngáy</div>
                    <div>Rất to 05.14 Th 5 05:29 <button class="preview-btn">Nghe</button></div>
                </div>
            `;
        }
        else if(tab === 'morning') {
            html += `<div class="card"><div class="flex-between"><span><i class="fas fa-sun"></i> Thói quen sáng</span><span class="pro-badge">+ Điểm</span></div><div>Hoàn thành nhiệm vụ để đánh thức cơ thể</div></div>`;
            // Nhóm nhiệm vụ
            html += `<div class="task-group"><div class="task-group-title">Những bạn biết</div>`;
            tasks.popular.forEach(t => {
                html += `<div class="task-card"><div><span class="task-name">${t.name}</span><span class="task-badge">${t.badge}</span></div><button class="preview-btn" data-type="${t.type}">Xem trước</button></div>`;
            });
            html += `</div><div class="task-group"><div class="task-group-title">Đánh thức bộ não của bạn</div>`;
            tasks.brain.forEach(t => {
                html += `<div class="task-card"><div><span class="task-name">${t.name}</span><span class="task-badge">${t.badge}</span></div><button class="preview-btn" data-type="${t.type}">Xem trước</button></div>`;
            });
            html += `</div><div class="task-group"><div class="task-group-title">Đánh thức cơ thể của bạn</div>`;
            tasks.body.forEach(t => {
                html += `<div class="task-card"><div><span class="task-name">${t.name}</span><span class="task-badge">${t.badge}</span></div><button class="preview-btn" data-type="${t.type}">Xem trước</button></div>`;
            });
            html += `</div><div class="card text-small"><center>Xóa tất cả quảng cáo <i class="fas fa-gem" style="color:#ffcc00"></i> Pro</center></div>`;
        }
        else if(tab === 'report') {
            html += `<div class="card"><div class="section-title">Báo cáo 11 thg 5 - 17 thg 5</div><div class="flex-between"><span>Báo cáo thử dãy</span><span>Báo cáo giấc ngủ</span><span>Báo cáo thói quen</span></div><div class="sleep-chart"><div>Ngủ sâu 4h</div><div>REM 2h</div><div>Ngủ nông 3h</div></div><div class="text-small">Thống kê nổi bật hàng tuần về tiếng ngáy: Rất to 05.14 Th5 05:29 <button class="preview-btn">Nghe</button></div><button class="preview-btn" style="margin-top:8px">Xem báo cáo hằng này</button></div>`;
        }
        else if(tab === 'settings') {
            html += `<div class="card"><div class="flex-between"><span>Đăng nhập vào tài khoản của bạn</span><i class="fas fa-user-circle"></i></div><div class="flex-between"><span>Điểm của tôi: 1,280 P</span><button class="preview-btn">Pro Upgrade</button></div><div class="flex-between"><span>Ngăn gỡ cài đặt ứng dụng off</span><div class="toggle-switch"></div></div><div class="flex-between"><span>Ngăn tắt nguồn off</span><div class="toggle-switch"></div></div></div>
            <div class="card"><div>Cài đặt báo thức nâng cao</div><div>Hiển thị</div><div>Ngõ ra âm thanh Thiết bị hiện tại</div><div>Cài đặt thông báo</div><div>Cấu hình hệ thống · Ngôn ngữ ứng dụng</div><div><strong>Báo thức không kêu?</strong> Tối ưu hóa báo thức</div></div>
            <div class="card"><div><i class="fas fa-headset"></i> Các câu hỏi thường gặp</div><div>Gửi phản hồi</div><div>Báo cáo vi phạm bản quyền</div><div>Thông tin về ứng dụng</div></div>`;
        }
        container.innerHTML = html;
        // Gắn sự kiện preview cho các nút Xem trước trong morning tab
        if(tab === 'morning') {
            document.querySelectorAll('.task-card .preview-btn').forEach(btn => {
                const type = btn.getAttribute('data-type');
                if(type) btn.addEventListener('click', (e) => { e.stopPropagation(); showPreview(type); });
            });
        }
        // Gắn sự kiện cho toggle trong alarm (chỉ demo)
        if(tab === 'alarm') {
            document.querySelectorAll('.toggle-switch').forEach(toggle => {
                toggle.addEventListener('click', function() { this.classList.toggle('active'); });
            });
        }
        if(tab === 'settings') {
            document.querySelectorAll('.toggle-switch').forEach(t => {
                t.addEventListener('click', function() { this.classList.toggle('active'); });
            });
        }
    }

    // Điều hướng tab
    function setActiveTab(tabId) {
        currentTab = tabId;
        renderTab(tabId);
        document.querySelectorAll('.nav-item').forEach(item => {
            if(item.getAttribute('data-tab') === tabId) item.classList.add('active');
            else item.classList.remove('active');
        });
    }

    // Sự kiện nav
    document.querySelectorAll('.nav-item').forEach(item => {
        item.addEventListener('click', () => {
            const tab = item.getAttribute('data-tab');
            setActiveTab(tab);
        });
    });

    // Thêm các preview khác cho các card riêng lẻ (ví dụ báo cáo nghe, v.v)
    // global function click cho nút nghe
    document.addEventListener('click', (e) => {
        if(e.target.innerText === 'Nghe' || (e.target.classList && e.target.innerText === 'Nghe')) {
            alert("Demo: phát âm thanh tiếng ngáy (giả lập)");
        }
        if(e.target.innerText === 'Dùng thử với $0') {
            alert("Dùng thử Pro 7 ngày miễn phí (demo)");
        }
        if(e.target.classList && e.target.classList.contains('preview-btn') && e.target.innerText !== 'Xem trước' && e.target.innerText !== 'Xong') {
            // bỏ qua
        }
    });

    // Hiển thị tab alarm ban đầu
    setActiveTab('alarm');
    // thêm thanh trạng thái "Đang theo dõi giấc ngủ..." footer
    const footerNote = document.createElement('div');
    footerNote.style.position = 'sticky';
    footerNote.style.bottom = '60px';
    footerNote.style.textAlign = 'center';
    footerNote.style.fontSize = '11px';
    footerNote.style.padding = '8px';
    footerNote.style.color = '#8e8e93';
    footerNote.style.background = '#fff';
    footerNote.innerText = 'Đang theo dõi giấc ngủ...';
    const mainContainer = document.getElementById('main-content');
    if(mainContainer) mainContainer.appendChild(footerNote);
    
    // giả lập âm lượng cập nhật clock phút
    setInterval(() => {
        if(currentTab === 'alarm') {
            const timeEl = document.querySelector('.status-bar .time-badge');
            if(timeEl) {
                const now = new Date();
                timeEl.innerHTML = `<i class="far fa-clock"></i> ${now.toLocaleTimeString('vi-VN', {hour:'2-digit', minute:'2-digit'})}`;
            }
        }
    }, 60000);
</script>
</body>
